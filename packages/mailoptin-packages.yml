note: >-
  IMPORTANT — none of these are client SDKs. MailOptin publishes no hosted product API,
  so there is nothing for an SDK to wrap. What it publishes is (a) the plugin itself,
  distributed through the WordPress.org plugin repository, and (b) the plugin's own
  internal PHP libraries, published to Packagist under the `mailoptin/` vendor namespace
  for its build. They are recorded here as real, first-party, dated distributions — and
  deliberately NOT wired as `type: SDKs`, because doing so would credit MailOptin with a
  developer SDK surface it does not have.
