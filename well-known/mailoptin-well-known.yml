note: >-
  mailoptin.com 403s every request that is not a browser and redirects to mailoptin.io,
  so the canonical host for every probe is mailoptin.io. Two real machine-readable
  documents are served: RFC 8414 OAuth 2.0 Authorization Server Metadata and RFC 9728
  OAuth 2.0 Protected Resource Metadata. Both exist because the WordPress site runs an
  MCP adapter (namespace `mcp` in the site's REST API) that is protected by an OAuth 2.1
  authorization code + PKCE flow. Everything else 404s. No security.txt is served, so no
  SecurityTxt pointer is emitted.
