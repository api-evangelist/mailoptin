generated: '2026-08-12'
method: probed
source: https://mailoptin.io/.well-known/oauth-protected-resource
status: live
name: MailOptin Site MCP Server
description: >-
  mailoptin.io runs a live Model Context Protocol server, exposed through the WordPress
  MCP Adapter as the `mcp` namespace of the site's REST API. It was discovered from the
  RFC 9728 protected-resource metadata document, which names
  https://mailoptin.io/wp-json/mcp/mcp-oauth-server as the protected resource. This is a
  surface over the MailOptin WORDPRESS SITE (content, site abilities), not a product API
  for the MailOptin lead-generation service — MailOptin ships as a self-hosted WordPress
  plugin and publishes no hosted product API.
servers:
- name: mcp-oauth-server
  url: https://mailoptin.io/wp-json/mcp/mcp-oauth-server
  transport: streamable-http
  methods_allowed: [POST, GET, DELETE]
  auth: oauth2
  auth_required: true
  probe:
    fetched: '2026-08-12'
    method: POST
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    response: '{"code":"mcp_unauthorized","message":"MCP authentication required.","data":{"status":401}}'
    www_authenticate: >-
      Bearer realm="https://mailoptin.io",
      resource_metadata="https://mailoptin.io/.well-known/oauth-protected-resource"
- name: mcp-adapter-default-server
  url: https://mailoptin.io/wp-json/mcp/mcp-adapter-default-server
  transport: streamable-http
  methods_allowed: [POST, GET, DELETE]
  auth: unknown
  note: >-
    Declared in the public route index at https://mailoptin.io/wp-json/mcp but not probed
    for tools; the default adapter server is normally cookie/nonce authenticated for
    logged-in WordPress users.
discovery:
- url: https://mailoptin.io/.well-known/oauth-protected-resource
  status: 200
- url: https://mailoptin.io/.well-known/oauth-authorization-server
  status: 200
- url: https://mailoptin.io/wp-json/mcp
  status: 200
  note: public namespace route index listing both MCP server routes
authorization:
  model: oauth2
  spec: RFC 8414 + RFC 9728 (MCP authorization)
  issuer: https://mailoptin.io
  authorization_endpoint: https://mailoptin.io/oauth/authorize
  token_endpoint: https://mailoptin.io/oauth/token
  revocation_endpoint: https://mailoptin.io/oauth/revoke
  grant_types: [authorization_code, refresh_token]
  pkce: S256
  scopes: [mcp]
  client_registration: client_id_metadata_document
  public_clients: true
tools:
