apis:
- aid: mailoptin-site
  name: MailOptin Site REST API and MCP Server
  description: 'The WordPress REST API served by mailoptin.io, plus the Model Context
    Protocol server exposed through the WordPress MCP Adapter at the mcp namespace. The
    REST root is a public, self-describing route index — 35 namespaces and 771 routes,
    each with its argument schema — and content routes under wp/v2 answer anonymously. The
    MCP endpoint is live but auth-gated, returning 401 mcp_unauthorized with a
    WWW-Authenticate Bearer challenge that links to RFC 9728 protected-resource metadata.
    This is the company website''s own surface, not a product API for the MailOptin
    lead-generation service, which ships as a self-hosted WordPress plugin.'
